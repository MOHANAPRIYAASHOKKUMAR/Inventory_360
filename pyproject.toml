[project]
name = "inventory-360"
version = "1.0.0"
description = "Inventory 360 - Enterprise Supply Chain Intelligence Platform for Sample Retail Group"
requires-python = ">=3.11"
# Runtime dependencies for Streamlit in Snowflake (container runtime) and local development
dependencies = [
    "streamlit[snowflake]==1.67.0",
    "snowflake-connector-python>=3.12",
    "snowflake-snowpark-python>=1.20",
    "pandas>=2.1",
    "numpy>=1.26",
    "altair>=5.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyyaml>=6",
    "jinja2>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "streamlit_app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402"]
